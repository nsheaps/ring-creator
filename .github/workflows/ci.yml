name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test
      - run: mise run validate
      - run: mise run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  screenshots:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: bunx playwright install --with-deps chromium
      - run: mise run build
      - run: mise run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/screenshots
          retention-days: 14
